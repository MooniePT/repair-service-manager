<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .win { fill: #ffffff; stroke: #CFD8DC; stroke-width: 1.5; }
    .bar { fill: #1E3528; }
    .field { fill: #F7F9F7; stroke: #B0BEC5; stroke-width: 1.2; }
    .lab { font-size: 12px; fill: #607D8B; font-weight: 700; }
    .val { font-size: 14px; fill: #263238; }
    .ph { font-size: 14px; fill: #90A4AE; }
    .cap { font-size: 13px; fill: #455A64; }
    .badge { fill: #E8F5E9; stroke:#66BB6A; stroke-width:1; }
  </style>

  <!-- janela -->
  <rect x="20" y="20" width="720" height="420" rx="10" class="win"/>
  <rect x="20" y="20" width="720" height="44" rx="10" class="bar"/>
  <circle cx="44" cy="42" r="6" fill="#FF5F57"/>
  <circle cx="64" cy="42" r="6" fill="#FEBC2E"/>
  <circle cx="84" cy="42" r="6" fill="#28C840"/>
  <text x="120" y="47" font-size="14" fill="#E8F5E9" font-weight="700">Cloudflare · Tunnels · Public Hostname</text>

  <text x="48" y="100" font-size="18" fill="#1B5E20" font-weight="700">Add a public hostname</text>
  <text x="48" y="124" class="cap">Diz ao Cloudflare que endereço público aponta para a tua app.</text>

  <!-- subdomain -->
  <text x="48" y="160" class="lab">SUBDOMAIN</text>
  <rect x="48" y="168" width="300" height="40" rx="6" class="field"/>
  <text x="64" y="193" class="val">assistencias</text>

  <!-- domain -->
  <text x="372" y="160" class="lab">DOMAIN</text>
  <rect x="372" y="168" width="320" height="40" rx="6" class="field"/>
  <text x="388" y="193" class="val">oteudominio.pt</text>

  <!-- type -->
  <text x="48" y="248" class="lab">TYPE</text>
  <rect x="48" y="256" width="300" height="40" rx="6" class="field"/>
  <text x="64" y="281" class="val">HTTP</text>
  <text x="320" y="281" class="val" fill="#90A4AE">▾</text>

  <!-- url -->
  <text x="372" y="248" class="lab">URL</text>
  <rect x="372" y="256" width="320" height="40" rx="6" class="field"/>
  <text x="388" y="281" class="val">web:5000</text>

  <rect x="372" y="306" width="320" height="26" rx="6" class="badge"/>
  <text x="386" y="324" font-size="12" fill="#1B5E20">⚠ é «web:5000», NÃO «localhost:5000»</text>

  <!-- save -->
  <rect x="560" y="372" width="132" height="44" rx="8" fill="#2E7D32"/>
  <text x="626" y="400" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">Save hostname</text>
</svg>
